# ==============================================================================
# CONFIG OPTIONS
#
# KMS runs AutoTune by default. An explicit context-window or nseq-max is a
# fixed sizing constraint and is never silently reduced. Leave cache-type-k and
# cache-type-v unset to let AutoTune try f16 first, then q8_0 for that exact
# context and concurrency. AutoTune never selects a cache type below q8_0. If
# q8_0 still does not fit, the requested context and concurrency are retained
# and the recommendation is reported as not fitting.
#
# example-model:
#   cache-min-tokens: 100                # Min tokens before IMC caches a message (default: 100)
#   admission-timeout: 3m                # Maximum wait for an SDK admission permit (default: 3m)
#   queue-depth: 2                       # Generation admission capacity multiplier (default: 2)
#   cache-type-k: q8_0                   # Explicit KV key type; omit for AutoTune (f16, then q8_0)
#   cache-type-v: q8_0                   # Explicit KV value type; omit for AutoTune (f16, then q8_0)
#   chat-template-kwargs:                # Model-level Jinja defaults; request values override matching keys
#   preserve_thinking: true              # Preserve prior tool-call reasoning when supported by the template
#   context-window: 8192                 # Per-sequence token capacity; explicit value is fixed
#   devices: [CUDA0, CUDA1]              # Devices to use (run `kronk devices` to list)
#   flash-attention: auto                # Flash Attention: enabled, disabled, auto (default: auto)
#   imc-session-capacity: 8              # Reusable IMC identities (default: nseq-max * max(3, queue-depth))
#   incremental-cache: true              # Incremental message caching (IMC) for agentic workflows (default: true)
#   insecure-logging: false              # Log potentially sensitive data like message content (debug only)
#   main-gpu: 0                          # Primary GPU index for single-GPU mode
#   nbatch: 2048                         # Logical batch size (default: nubatch * nseq-max; multi-slot MTP caps at nubatch)
#   ngpu-layers: 0                       # GPU layers to offload (0 = all, -1 = none, N = specific count)
#   nseq-max: 2                          # Parallel sequences; explicit value is fixed
#   nthreads: 0                          # Threads for generation (0 = llama.cpp default)
#   nthreads-batch: 0                    # Threads for batch processing (0 = llama.cpp default)
#   nubatch: 2048                        # Physical batch size for prompt ingestion (default: 2048)
#   numa: distribute                     # NUMA strategy: "" (off), distribute, isolate, numactl, mirror
#   offload-kqv: true                    # Offload KV cache to GPU (false = keep on CPU)
#   op-offload: true                     # Offload tensor operations to GPU (false = keep on CPU)
#   op-offload-min-batch: 0              # Min batch size before host tensor ops are offloaded (0 = default)
#   proj-on-cpu: true                    # Force multimodal projector (mmproj) onto CPU
#   rope-freq-base: 1000000              # RoPE base frequency (nil = from model, e.g., 10000 Llama, 1000000 Qwen)
#   rope-freq-scale: 0.25                # RoPE frequency scale (nil = auto-calculated)
#   rope-scaling-type: yarn              # RoPE scaling: none, linear, yarn
#   session-store-kind: ram              # IMC session storage backend (currently ram only)
#   split-mode: row                      # Multi-GPU split: none, layer, row (row recommended for MoE models)
#   swa-full: true                       # Full KV cache for SWA layers (unset = llama.cpp default; false = compact SWA)
#   template: qwen3.jinja                # Jinja template file override (from templates dir)
#   tensor-buft-overrides: [all-ffn]     # Force tensors to CPU: all-ffn, block:N, or regex
#   tensor-split: [0.6, 0.4]             # Per-device tensor distribution (must match device count)
#   load-mode: mmap                      # Model loading: mmap (default), none, mlock, direct-io
#   yarn-attn-factor: 1.0                # YaRN attention magnitude scaling (nil = default 1.0)
#   yarn-beta-fast: 32.0                 # YaRN low correction dimension (nil = default 32.0)
#   yarn-beta-slow: 1.0                  # YaRN high correction dimension (nil = default 1.0)
#   yarn-ext-factor: 1.0                 # YaRN extrapolation mix factor (nil = auto, 0 = disable)
#   yarn-orig-ctx: 32768                 # Original training context size (nil = from model)
#
#   # Mixture of Experts (MoE) tensor placement (nested):
#   moe:
#     mode: experts_cpu                  # auto, experts_cpu, experts_gpu, keep_top_n, custom
#     keep-experts-top-n: 4              # Keep experts on GPU for top N layers (only when mode: keep_top_n)
#
#   # Fixed load-time LoRA adapters. Set exactly one of id or path per entry.
#   # An id omits .gguf and resolves under <base-path>/lora; path is absolute.
#   # Kronk does not download adapter files. Scale defaults to 1.0.
#   adapters:
#     - id: org/support                  # Resolves to <base-path>/lora/org/support.gguf
#       scale: 1.0                       # Finite non-negative scale, fixed until model reload
#     - path: /opt/adapters/concise.gguf # Existing llama.cpp-compatible adapter GGUF
#       scale: 0.5
#
#   # Speculative decoding (nested). Set model-id for a separate draft GGUF
#   # (requires nseq-max: 1); omit model-id and set only ndraft to override the
#   # draft-token count for an auto-detected MTP head on the target.
#   draft-model:
#     model-id: org/Draft-Model.Q8_0     # Draft model id (separate-GGUF drafter; requires nseq-max: 1)
#     ndraft: 5                          # Tokens to draft per step (separate-GGUF default 5, MTP default 2)
#     devices: [CUDA0]                   # Devices for the draft model
#     main-gpu: 0                        # Primary GPU index for the draft model
#     ngpu-layers: 0                     # GPU layers for the draft model (0 = all)
#     tensor-split: [1.0]                # Per-device tensor split for the draft model
#
#   # Per-request default sampling parameters (nested):
#   sampling-parameters:
#     temperature: 0.6                   # Sampling temperature
#     top_k: 20                          # Top-K sampling
#     top_p: 0.95                        # Top-P (nucleus) sampling
#     min_p: 0.0                         # Min-P sampling
#     seed: 42                           # Sampling seed (unset = random)
#     max_tokens: 0                      # Max tokens to generate (0 = until stop/EOS)
#     repeat_penalty: 1.0                # Repetition penalty
#     repeat_last_n: 64                  # Tokens to consider for repetition penalty
#     dry_multiplier: 0.0                # DRY repetition penalty multiplier
#     dry_base: 1.75                     # DRY repetition penalty base
#     dry_allowed_length: 2              # DRY allowed sequence length
#     dry_penalty_last_n: -1             # DRY tokens to scan (-1 = context size)
#     xtc_probability: 0.0               # XTC sampling probability
#     xtc_threshold: 0.1                 # XTC sampling threshold
#     xtc_min_keep: 1                    # XTC minimum tokens to keep
#     frequency_penalty: 0.0             # Frequency penalty
#     presence_penalty: 0.0              # Presence penalty
#     enable_thinking: ""                # Enable thinking mode (model-specific)
#     reasoning_effort: ""               # Reasoning effort (model-specific)
#     grammar: ""                        # GBNF grammar constraint

# ==============================================================================
# MODEL SELECTION NOTES
#
# These suffixes define how a Large Language Model (LLM) is quantized-compressed
# from its original size to fit into computer memory (RAM/VRAM). The primary
# difference lies in the balance between model size, inference speed, and output
# accuracy (intelligence).
#
# - F16 (FP16): Unquantized, maximum quality, largest size.
# - Q8_0: 8-bit, near-lossless compression, very high quality. (Best for local)
# - K_XL: K-quant (smart) method, high efficiency, better accuracy than
#         standard _0 at similar sizes.
#
# GGUF names describe model-weight quantization. They are separate from
# cache-type-k and cache-type-v, which control the runtime KV cache. Q8_0 is an
# integer block quantization format, not the same format as hardware FP8.

# ==============================================================================
# ROPE AND YARN NOTES
#
# YaRN (Yet another RoPE extensioN) enables extended context windows beyond a
# model's native training length. For example, Qwen3 models trained on 32k can
# support 131k context with YaRN scaling.
#
# Minimal configuration for YaRN (llama.cpp auto-calculates the rest):
#   rope-scaling-type: yarn
#   yarn-orig-ctx: 32768       # Original training context size
#   context-window: 131072     # Desired extended context
#
# Auto-calculated defaults when using YaRN:
#   rope-freq-base    - Read from model metadata (Qwen3 = 1000000, Llama = 10000)
#   rope-freq-scale   - Auto-calculated from context ratio
#   yarn-ext-factor   - Auto-calculated (nil triggers this)
#   yarn-attn-factor  - 1.0
#   yarn-beta-fast    - 32.0
#   yarn-beta-slow    - 1.0
#
# The advanced parameters exist for models with non-standard RoPE configurations
# (e.g., DeepSeek-V2). For typical YaRN usage, the minimal config is sufficient.
#
# Note: Extended context increases KV cache memory proportionally. A 4x context
# extension (32k → 131k) requires 4x the KV cache VRAM per slot.

# ==============================================================================
# CONFIGURATION NOTES
#
# INCREMENTAL MESSAGE CACHE (IMC)
# -------------------------------
# Use IMC for agentic workflows (OpenCode, Kilo Code, etc). IMC dedicates each
# slot to a conversation and caches all messages except the last one, so only
# the new message needs prefilling on each turn.
#
# Two-tier hash design: IMC tracks separate hashes for the system prompt
# (tier 1) and the full conversation (tier 2). When conversation history
# changes but the system prompt stays the same, IMC keeps the system prompt
# KV state and only re-decodes the conversation body - saving thousands of
# tokens of redundant prefill.
#
# Works with any model template. Deterministic templates (Qwen, Gemma) use
# fast hash matching. Non-deterministic templates (GPT-OSS, GLM) fall back
# to token prefix matching, salvaging the longest common prefix in the KV
# cache. Non-deterministic templates may also trigger rebuilds when
# re-templating the same messages produces a different token count.
#
# Set nseq-max to at least the number of concurrent sub-agents your framework
# spawns. Each slot independently tracks its own conversation branch.
#
#   nseq-max: 2
#   incremental-cache: true
#
# KV CACHE PER SLOT (nseq-max > 1)
# ---------------------------------
# Kronk allocates context-window * nseq-max total tokens and uses split KV
# streams. Every slot receives one fixed context-window partition; the context
# window is not divided by nseq-max, and an idle slot's partition is not
# borrowed by another slot.
#
# Example:
#   context-window: 131072, nseq-max: 3
#   → Total KV cache sized for 393k tokens
#   → Each of the 3 slots receives a fixed 131k-token stream
#
# Increasing nseq-max therefore increases planned KV memory linearly.


# ==============================================================================
# AI-TRAINING EXAMPLE MODELS
#
# Keys are the canonical model ID exactly as `kronk model list --local` prints
# it, which is also the string the examples send as the request's `model`
# value. Lookup is an exact match, so `Qwen3-8B-Q8_0` and
# `unsloth/Qwen3-8B-Q8_0` are two different keys.
#
# AutoTune sizes anything left out. These entries pin only context-window and
# nseq-max, the two constraints the examples actually depend on; cache types
# stay unset so AutoTune tries f16 first and falls back to q8_0.
#
# Examples that drive the SDK directly (example13, example16) build their own
# model.Config in code and never read this file. It applies to the examples
# that talk to a running server on :11435.

# Chat. example04, example06, example15.
Qwen3-8B-Q8_0:
  context-window: 32768
  nseq-max: 2

# Chat and tool calling. example07, example09, example10, example11/step2,
# example12. MoE, so AutoTune picks the expert placement and split mode.
Qwen3.6-35B-A3B-UD-Q4_K_XL:
  context-window: 32768
  nseq-max: 2

# Vision. example08, example11/step1. The large nubatch is for image
# ingestion, where the projector output arrives as one big prompt chunk.
Qwen2.5-VL-3B-Instruct-Q8_0:
  context-window: 8192
  nbatch: 2048
  nubatch: 2048

# Embeddings. example02, example03, example05, example06, example08,
# example11, example15. The 2048 window is the model's own limit, not a
# budget choice. nseq-max batches whole inputs, so chunk loops embed in
# groups instead of one call per chunk.
embeddinggemma-300m-qat-Q8_0:
  context-window: 2048
  nbatch: 2048
  nubatch: 512
  nseq-max: 4

# Reranking. example16/step5. A cross-encoder: question plus chunk in, one
# score out, so nseq-max here is query-document pairs per batch.
bge-reranker-v2-m3-Q8_0:
  context-window: 8192
  nseq-max: 4
